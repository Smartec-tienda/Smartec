<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc,
  updateDoc, serverTimestamp, query, where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

/* ============ CONFIG ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCJ-bKabzQL5DIq2n1qlHKHadlEY17TT_I",
  authDomain: "smartec-8fc19.firebaseapp.com",
  projectId: "smartec-8fc19",
  storageBucket: "smartec-8fc19.firebasestorage.app",
  messagingSenderId: "879944967068",
  appId: "1:879944967068:web:287b3f2baf2c56f8b95e59",
  measurementId: "G-127MH9ZCN1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

/* ============ ESTADO ============ */
let currentUser = null;
let currentUserData = null;
let currentStore = null;
let stores = [];
let warranties = [];
let customers = [];
let sales = [];
let users = [];

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(Number(n||0)).toLocaleString('es-CO');
const escapeHtml = window.Smartec.escapeHtml;   // 🆕
const fmtDate = ts => {
  if (!ts) return '-';
  const d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  return d.toLocaleDateString('es-CO', { year:'2-digit', month:'2-digit', day:'2-digit' });
};

function normalizePhone(raw) {
  if (!raw) return '';
  let p = String(raw).replace(/\D/g, '');
  if (p.length === 10) p = '57' + p;
  return p;
}

async function audit(entry) {
  try {
    await addDoc(collection(db,'auditLog'), {
      ...entry,
      userId: currentUser?.uid || null,
      userEmail: currentUser?.email || null,
      userRole: currentUserData?.role || null,
      storeId: currentStore?.storeId || null,
      timestamp: serverTimestamp()
    });
  } catch(e) { console.warn('audit fail', e); }
}

/* Generar consecutivo de garantía */
async function generateWarrantyNumber(storeId) {
  const year = new Date().getFullYear();
  const counterId = `${storeId}_garantia_${year}`;
  const ref = doc(db,'counters', counterId);

  try {
    const { runTransaction } = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");
    const result = await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if (!snap.exists()) {
        // Inicializar si no existe
        const prefix = storeId.slice(0,3).toUpperCase() + '-GAR-' + year + '-';
        transaction.set(ref, {
          prefix,
          lastNumber: 1,
          type: 'garantia',
          storeId,
          year,
          createdAt: serverTimestamp()
        });
        return { number: 1, prefix, fullNumber: prefix + '0001' };
      }
      const data = snap.data();
      const nextNumber = (Number(data.lastNumber) || 0) + 1;
      transaction.update(ref, {
        lastNumber: nextNumber,
        updatedAt: serverTimestamp()
      });
      return {
        number: nextNumber,
        prefix: data.prefix,
        fullNumber: data.prefix + String(nextNumber).padStart(4, '0')
      };
    });
    return result;
  } catch(e) {
    console.error('Error generando consecutivo:', e);
    return { fullNumber: 'GAR-' + Date.now() };
  }
}

/* ============ AUTH ============ */
$('login-btn').onclick = async () => {
  const err = $('login-error');
  err.classList.add('hidden');
  try {
    await signInWithEmailAndPassword(auth, $('login-email').value.trim(), $('login-pass').value);
  } catch(e) {
    err.innerText = 'Error: ' + e.message;
    err.classList.remove('hidden');
  }
};

$('logout-btn').onclick = async () => {
  if (window.SmartecKiosk) window.SmartecKiosk.disable();
  await audit({ action:'logout', collection:'system', note:'Cierre de sesión' });
  await signOut(auth);
  window.location.href = 'home.html';
};

onAuthStateChanged(auth, async user => {
  document.getElementById('loading-screen').classList.add('hidden');

  if (!user) {
    window.location.href = 'home.html';
    return;
  }

  currentUser = user;
  try {
    const snap = await getDoc(doc(db,'users',user.uid));
    currentUserData = snap.exists() ? snap.data() : null;
  } catch(e) { currentUserData = null; }

  const validRoles = ['superadmin','admin','vendedor'];
  if (!currentUserData || !validRoles.includes(currentUserData.role)) {
    alert('⛔ No tienes permisos.');
    await signOut(auth);
    window.location.href = 'home.html';
    return;
  }

  if (currentUserData.role !== 'superadmin' && !currentUserData.storeId) {
    alert('⛔ No tienes una tienda asignada.');
    await signOut(auth);
    window.location.href = 'home.html';
    return;
  }
    // 🔒 Activar modo kiosco si el usuario lo tiene configurado
    if (currentUserData.kioskMode === true) {
      window.SmartecKiosk.enable(() => {
        if (confirm('⚠️ Saliste de la aplicación.\n\n¿Cerrar sesión?')) {
          window.location.href = 'home.html';
        }
      });
    }
  await audit({ action:'login', collection:'system', note:'Inicio de sesión garantías' });

  $('login-screen').classList.add('hidden');
  $('panel-screen').classList.remove('hidden');

  $('user-info').innerText = '👤 ' + user.email;
  const roleLabels = { superadmin:'Superadmin', admin:'Admin de tienda', vendedor:'Vendedor' };
  $('header-role').innerText = roleLabels[currentUserData.role] || currentUserData.role;

  await loadAll();
});

/* ============ CARGA ============ */
async function loadAll() {
  const C = window.SmartecCache;
  const isSuper = currentUserData.role === 'superadmin';
  const myStoreId = currentUserData.storeId;

  stores = await C.wrap('stores', async () => {
    const s = await getDocs(collection(db,'stores'));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  });

  // Configurar tienda
  if (isSuper) {
    const activeStores = stores.filter(s => s.active).sort((a,b) => a.name.localeCompare(b.name));
    if (!activeStores.length) {
      alert('⛔ No hay tiendas activas.');
      return;
    }
    const saved = sessionStorage.getItem('smartec_garantias_store');
    currentStore = activeStores.find(s => s.storeId === saved) || activeStores[0];
    sessionStorage.setItem('smartec_garantias_store', currentStore.storeId);

    const sel = $('store-selector');
    sel.classList.remove('hidden');
    sel.innerHTML = activeStores.map(s =>
      `<option value="${s.storeId}" ${s.storeId === currentStore.storeId ? 'selected' : ''}>🏪 ${s.name}</option>`
    ).join('');
    $('header-title').classList.add('hidden');

    sel.onchange = async () => {
      currentStore = stores.find(s => s.storeId === sel.value);
      sessionStorage.setItem('smartec_garantias_store', sel.value);
      await loadWarrantiesAndCustomers();
      renderAll();
    };
  } else {
    currentStore = stores.find(s => s.storeId === myStoreId);
    if (!currentStore) {
      alert('⛔ Tu tienda no existe.');
      await signOut(auth);
      window.location.href = 'home.html';
      return;
    }
    $('store-selector').classList.add('hidden');
    $('header-title').innerText = 'Garantías · ' + currentStore.name;
  }

  await loadWarrantiesAndCustomers();
  renderAll();
}

async function loadWarrantiesAndCustomers() {
  const C = window.SmartecCache;

  warranties = await C.wrap('warranties_all', async () => {
    const s = await getDocs(collection(db,'warranties'));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  });

  customers = await C.wrap('customers_all', async () => {
    const s = await getDocs(collection(db,'customers'));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  });

  users = await C.wrap('users', async () => {
    const s = await getDocs(collection(db,'users'));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  });

  sales = await C.wrap('sales_all_for_warranties', async () => {
    const s = await getDocs(collection(db,'sales'));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  });
}

/* ============ FILTROS ============ */
window.clearFilters = () => {
  $('f-search').value = '';
  $('f-responsible').value = '';
  $('f-status').value = 'all';
  $('f-priority').value = 'all';
  $('f-sort').value = 'recent';
  renderAll();
};  

['f-search','f-responsible','f-status','f-priority','f-sort'].forEach(id => {
  const el = $(id);
  if (el) {
    el.addEventListener('input', renderAll);
    el.addEventListener('change', renderAll);
  }
});

function getFiltered() {
  let list = warranties.slice();

  // Filtro por tienda según rol
  if (currentUserData.role !== 'superadmin') {
    list = list.filter(w => w.storeId === currentUserData.storeId);
  } else {
    list = list.filter(w => w.storeId === currentStore.storeId);
  }

  const search = ($('f-search').value || '').toLowerCase().trim();
  if (search) {
    list = list.filter(w =>
      (w.ticketNumber||'').toLowerCase().includes(search) ||
      (w.customerName||'').toLowerCase().includes(search) ||
      (w.productName||'').toLowerCase().includes(search) ||
      (w.issueDescription||'').toLowerCase().includes(search)
    );
  }

  const respFilter = ($('f-responsible').value || '').toLowerCase().trim();
  if (respFilter) {
    list = list.filter(w => (w.responsible || '').toLowerCase().includes(respFilter));
  }

  const statusF = $('f-status').value;
  if (statusF !== 'all') list = list.filter(w => w.status === statusF);

  const priorityF = $('f-priority').value;
  if (priorityF !== 'all') list = list.filter(w => w.priority === priorityF);

  const sort = $('f-sort').value;
  switch(sort) {
    case 'recent':
      list.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
      break;
    case 'oldest':
      list.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
      break;
    case 'priority': {
      const prioVal = { alta: 3, media: 2, baja: 1 };
      list.sort((a,b) => (prioVal[b.priority]||0) - (prioVal[a.priority]||0));
      break;
    }
  }

  return list;
}

/* ============ RENDER ============ */
function renderAll() {
  renderKPIs();
  renderTable();
}

function renderKPIs() {
  let base = warranties.slice();
  if (currentUserData.role !== 'superadmin') {
    base = base.filter(w => w.storeId === currentUserData.storeId);
  } else {
    base = base.filter(w => w.storeId === currentStore.storeId);
  }

  $('kpi-total').innerText = base.length;
  $('kpi-abierto').innerText = base.filter(w => w.status === 'abierto').length;
  $('kpi-proceso').innerText = base.filter(w => w.status === 'en_proceso').length;
  $('kpi-resuelto').innerText = base.filter(w => w.status === 'resuelto').length;
  $('kpi-rechazado').innerText = base.filter(w => w.status === 'rechazado').length;
}

function renderTable() {
  const tb = $('tickets-tbody');
  const empty = $('tickets-empty');
  const list = getFiltered();

  $('results-count').innerText = `${list.length} ticket${list.length !== 1 ? 's' : ''}`;

  if (!list.length) {
    tb.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  tb.innerHTML = list.slice(0, 500).map(w => {
    const statusCls = {
      abierto: 'bg-blue-100 text-blue-700',
      en_proceso: 'bg-orange-100 text-orange-700',
      resuelto: 'bg-green-100 text-green-700',
      rechazado: 'bg-red-100 text-red-700'
    }[w.status] || 'bg-gray-100 text-gray-700';

    const statusLbl = {
      abierto: 'Abierto',
      en_proceso: 'En proceso',
      resuelto: 'Resuelto',
      rechazado: 'Rechazado'
    }[w.status] || w.status;

    const prioCls = {
      alta: 'bg-red-100 text-red-700',
      media: 'bg-yellow-100 text-yellow-700',
      baja: 'bg-gray-100 text-gray-600'
    }[w.priority] || 'bg-gray-100 text-gray-600';

    const prioLbl = (w.priority||'media').charAt(0).toUpperCase() + (w.priority||'media').slice(1);

    return `<tr class="border-b hover:bg-gray-50">
      <td class="p-3 text-xs font-mono font-semibold text-sd">${escapeHtml(w.ticketNumber) || '-'}</td>
      <td class="p-3 text-xs text-gray-500">${fmtDate(w.createdAt)}</td>
      <td class="p-3 text-xs">${escapeHtml(w.customerName) || '-'}<br><span class="text-[10px] text-gray-400">${w.customerPhone || ''}</span></td>
      <td class="p-3 text-xs">${escapeHtml(w.productName) || '-'}</td>
      <td class="p-3 text-xs">${escapeHtml(w.responsible) || '-'}</td>
      <td class="p-3 text-center"><span class="text-[10px] px-2 py-0.5 rounded ${prioCls} font-semibold">${prioLbl}</span></td>
      <td class="p-3 text-center"><span class="text-[10px] px-2 py-0.5 rounded ${statusCls} font-semibold">${statusLbl}</span></td>
      <td class="p-3 text-right whitespace-nowrap">
        <button onclick='viewDetail("${w.id}")' class="text-sl hover:underline text-xs">Ver</button>
      </td>
    </tr>`;
  }).join('');
}

/* ============ FORMULARIO ============ */

async function tryAutocomplete() {
  const phone = normalizePhone($('t-phone').value.trim());
  const status = $('t-phone-status');

  if (phone.length < 10) { status.innerText = ''; return; }

  try {
    const snap = await getDoc(doc(db,'customers',phone));
    if (!snap.exists()) {
      status.innerText = 'Cliente nuevo (se creará al guardar)';
      status.className = 'text-[10px] text-gray-400 mt-1';
      return;
    }
    const c = snap.data();
    if (!$('t-name').value.trim()) $('t-name').value = c.name || '';
    status.innerHTML = `✅ Cliente: <b>${c.name}</b>`;
    status.className = 'text-[10px] text-green-600 mt-1';
  } catch(e) {
    console.warn(e);
  }
}

window.saveTicket = async () => {
  const phone = normalizePhone($('t-phone').value.trim());
  const name = $('t-name').value.trim();
  const product = $('t-product').value.trim();
  const sku = $('t-sku').value.trim();
  const purchaseDate = $('t-purchaseDate').value;
  const warrantyMonths = Number($('t-warrantyMonths').value) || 12;
  const priority = $('t-priority').value;
  const issue = $('t-issue').value.trim();
  const responsible = $('t-responsible').value.trim();
  const storeId = $('t-store')?.value || currentStore.storeId;

  if (!phone || phone.length < 10) return alert('El teléfono es obligatorio (10 dígitos)');
  if (!name) return alert('El nombre del cliente es obligatorio');
  if (!product) return alert('El producto es obligatorio');
  if (!issue) return alert('La descripción del problema es obligatoria');

  // Calcular fecha de fin de garantía
  let warrantyEndDate = null;
  if (purchaseDate) {
    const pd = new Date(purchaseDate);
    const end = new Date(pd.getFullYear(), pd.getMonth() + warrantyMonths, pd.getDate());
    warrantyEndDate = end.toISOString().split('T')[0];
  }

  const btn = event.target;
  btn.disabled = true; btn.innerText = '⏳ Guardando...';

  try {
    // Subir archivos
    const attachments = [];
    const files = $('t-files').files;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
            // Sanitizar el nombre del archivo (quitar caracteres problemáticos)
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `warranties/${storeId}/${Date.now()}_${i}_${safeName}`;
      const fRef = storageRef(storage, path);
      await uploadBytes(fRef, file);
      const url = await getDownloadURL(fRef);
      attachments.push({ url, name: file.name, type: file.type });
    }

    // Generar ticket number
    const docNum = await generateWarrantyNumber(storeId);

    // Crear ticket
    const data = {
      ticketNumber: docNum.fullNumber,
      customerId: phone,
      customerName: name,
      customerPhone: phone,
      productName: product,
      sku,
      purchaseDate: purchaseDate || null,
      warrantyMonths,
      warrantyEndDate,
      issueDescription: issue,
      responsible,
      status: 'abierto',
      priority,
      notes: '',
      resolution: '',
      attachments,
      storeId,
      storeName: stores.find(s => s.storeId === storeId)?.name || storeId,
      createdBy: currentUser.email,
      createdByName: currentUserData.name || currentUser.email,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    };

    const ref = await addDoc(collection(db,'warranties'), data);

    await audit({
      action: 'create',
      collection: 'warranties',
      docId: ref.id,
      after: data,
      note: `Ticket garantía: ${docNum.fullNumber} · ${product}`
    });

    // Asegurar que el cliente exista
    const custRef = doc(db,'customers',phone);
    const custSnap = await getDoc(custRef);
    if (!custSnap.exists()) {
      await setDoc(custRef, {
        name,
        phone,
        tags: ['Cliente'],
        totalSpent: 0,
        purchaseCount: 0,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        createdBy: currentUser.email,
        storeId
      });
    }

    window.SmartecCache.invalidate('warranties_all');
    closeTicketForm();
    await loadWarrantiesAndCustomers();
    renderAll();
    alert('✅ Ticket creado: ' + docNum.fullNumber);
  } catch(e) {
    console.error(e);
    alert('Error: ' + e.message);
    btn.disabled = false; btn.innerText = 'Crear ticket';
  }
};

window.closeDetail = () => {
  const m = $('detail-modal');
  m.classList.add('hidden'); m.classList.remove('flex');
};

window.changeStatus = async (id, newStatus) => {
  try {
    await updateDoc(doc(db,'warranties',id), {
      status: newStatus,
      updatedAt: serverTimestamp()
    });
    await audit({ action:'update', collection:'warranties', docId:id, note:`Estado: ${newStatus}` });
    window.SmartecCache.invalidate('warranties_all');
    closeDetail();
    await loadWarrantiesAndCustomers();
    renderAll();
  } catch(e) {
    alert('Error: ' + e.message);
  }
};

window.addNote = async (id) => {
  const note = $('d-notes').value.trim();
  if (!note) return alert('Escribe una nota');
  const w = warranties.find(x => x.id === id);
  const current = w.notes || '';
  const newNote = current
    ? current + '\n[' + new Date().toLocaleString('es-CO') + '] ' + note
    : '[' + new Date().toLocaleString('es-CO') + '] ' + note;
  await updateDoc(doc(db,'warranties',id), {
    notes: newNote,
    updatedAt: serverTimestamp()
  });
  await audit({ action:'update', collection:'warranties', docId:id, note:'Nota agregada: ' + note });
  window.SmartecCache.invalidate('warranties_all');
  closeDetail();
  await loadWarrantiesAndCustomers();
  renderAll();
};

window.resolveTicket = async (id) => {
  const resolution = $('d-resolution').value.trim();
  if (!resolution) return alert('Describe qué se hizo');
  if (!confirm('¿Marcar este ticket como resuelto?')) return;

  await updateDoc(doc(db,'warranties',id), {
    status: 'resuelto',
    resolution,
    resolvedAt: serverTimestamp(),
    resolvedBy: currentUser.email,
    updatedAt: serverTimestamp()
  });
  await audit({ action:'update', collection:'warranties', docId:id, note:'Ticket resuelto: ' + resolution });
  window.SmartecCache.invalidate('warranties_all');
  closeDetail();
  await loadWarrantiesAndCustomers();
  renderAll();
  alert('✅ Ticket resuelto');
};

window.rejectTicket = async (id) => {
  const reason = $('d-rejectReason').value.trim();
  if (!reason) return alert('Escribe el motivo del rechazo');
  if (!confirm('¿Rechazar este ticket?')) return;

  await updateDoc(doc(db,'warranties',id), {
    status: 'rechazado',
    rejectionReason: reason,
    rejectedAt: serverTimestamp(),
    rejectedBy: currentUser.email,
    updatedAt: serverTimestamp()
  });
  await audit({ action:'update', collection:'warranties', docId:id, note:'Ticket rechazado: ' + reason });
  window.SmartecCache.invalidate('warranties_all');
  closeDetail();
  await loadWarrantiesAndCustomers();
  renderAll();
  alert('⛔ Ticket rechazado');
};

window.updateResponsible = async (id) => {
  const responsible = $('d-responsible').value.trim();

  try {
    await updateDoc(doc(db,'warranties',id), {
      responsible,
      updatedAt: serverTimestamp()
    });
    await audit({
      action: 'update',
      collection: 'warranties',
      docId: id,
      note: 'Responsable: ' + (responsible || '(sin asignar)')
    });
    window.SmartecCache.invalidate('warranties_all');
    closeDetail();
    await loadWarrantiesAndCustomers();
    renderAll();
    alert('✅ Responsable actualizado');
  } catch(e) {
    console.error(e);
    alert('Error: ' + e.message);
  }
};


/* ============ REFRESCAR ============ */
window.forceRefresh = async () => {
  window.SmartecCache.clear();
  await loadAll();
  alert('✅ Datos actualizados');
};

/* Cerrar con ESC */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('ticket-modal').classList.contains('hidden')) return closeTicketForm();
    if (!$('detail-modal').classList.contains('hidden')) return closeDetail();
  }
});
</script>
