<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir documento | Smartec</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="common.js"></script>
<script src="cache.js"></script>
<script src="header-app.js"></script>
<script src="favicon.js"></script>


<style>
  :root{
    --sd:#0A2A4A;
    --sl:#4A7A9A;
    --apple-blue:#0071E3;
    --apple-pink:#FF375F;
    --apple-green:#30D158;
    --apple-orange:#FF9F0A;
    --apple-text:#1D1D1F;
    --apple-dim:#6E6E73;
    --apple-border:rgba(0,0,0,0.08);
  }

  /* ============ BASE ============ */
  *{ -webkit-font-smoothing:antialiased; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, Helvetica, sans-serif;
    margin: 0;
    background: #F5F5F7;
    color: var(--apple-text);
  }

  /* ============ TOOLBAR (SOLO PANTALLA) ============ */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    color: var(--apple-text);
    padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
    z-index: 100;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  }
  .toolbar h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--apple-text);
    letter-spacing: -0.01em;
    margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .toolbar .format-switch {
    display: flex; gap: 6px;
    background: rgba(0,0,0,0.04);
    border-radius: 999px;
    padding: 3px;
  }
  .toolbar .format-switch button {
    background: transparent;
    color: var(--apple-dim);
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
  }
  .toolbar .format-switch button.active {
    background: white;
    color: var(--apple-text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.08);
  }
  .toolbar .format-switch button:hover:not(.active) {
    color: var(--apple-text);
  }
  .toolbar .actions {
    display: flex; gap: 8px;
  }
  .toolbar .btn-print {
    background: var(--apple-blue);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 1px 2px rgba(0,113,227,0.2), 0 4px 12px rgba(0,113,227,0.3);
  }
  .toolbar .btn-print:hover {
    background: #0077ED;
    transform: scale(1.02);
  }
    /* 🆕 Botón WhatsApp en la toolbar */
  .toolbar .btn-whatsapp {
    background: #25D366;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 1px 2px rgba(37,211,102,0.2), 0 4px 12px rgba(37,211,102,0.3);
  }
  .toolbar .btn-whatsapp:hover {
    background: #1EBE5A;
    transform: scale(1.02);
  }
  .toolbar .btn-whatsapp:active { transform: scale(0.98); }
  .toolbar .btn-close {
    background: rgba(0,0,0,0.05);
    color: var(--apple-text);
    border: none;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
  }
  .toolbar .btn-close:hover { background: rgba(0,0,0,0.1); }

  /* ============ WRAPPER ============ */
  .doc-wrapper {
    padding: 96px 20px 40px;
    min-height: 100vh;
    background:
      radial-gradient(at 20% 20%, rgba(90,200,250,0.10) 0%, transparent 50%),
      radial-gradient(at 80% 10%, rgba(191,90,242,0.08) 0%, transparent 50%),
      #F5F5F7;
  }

  /* ============ DOCUMENTO (REMISIÓN / MEDIA CARTA) ============ */
  .doc {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06), 0 24px 64px rgba(0,0,0,0.08);
    max-width: 216mm;
    margin: 0 auto;
  }
  /* Media carta: ancho reducido (140mm) */
  .doc.doc-mediacarta {
    max-width: 140mm;
    padding: 32px;
  }

  /* ============ CABECERA DEL DOCUMENTO ============ */
  .doc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--apple-blue);
  }
  .doc-header .brand h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin: 0;
    color: var(--apple-blue);
  }
  .doc-header .brand h1 span { color: var(--apple-text); }
  .doc-header .brand .sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--apple-dim);
    letter-spacing: 0.5px;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .doc-header .brand .company-info {
    font-size: 11px;
    color: #555;
    margin-top: 10px;
    line-height: 1.6;
  }
  .doc-header .brand .company-info b { color: var(--apple-text); }
  .doc-header .doc-type { text-align: right; }
  .doc-header .doc-type .t {
    font-size: 20px;
    font-weight: 800;
    color: var(--apple-text);
    letter-spacing: -0.02em;
  }
  .doc-header .doc-type .num {
    font-size: 12px;
    color: var(--apple-text);
    margin-top: 4px;
  }
  .doc-header .doc-type .num b { font-weight: 700; }
  .doc-header .doc-type .date {
    font-size: 11px;
    color: var(--apple-dim);
    margin-top: 2px;
  }
  .doc-header .doc-type .store {
    font-size: 11px;
    color: var(--apple-dim);
    margin-top: 6px;
  }
  .doc-header .doc-type .store b { color: var(--apple-text); }

  /* ============ SECCIONES ============ */
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--apple-blue);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(0,113,227,0.15);
  }
  .section-body {
    font-size: 12px;
    color: #333;
    line-height: 1.6;
  }
  .section-body b { color: var(--apple-text); font-weight: 600; }

  /* ============ TABLA DE ITEMS ============ */
  table.items {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 11px;
  }
  table.items th {
    background: var(--apple-blue);
    color: white;
    padding: 10px 8px;
    text-align: left;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  table.items th:first-child { border-top-left-radius: 6px; }
  table.items th:last-child { border-top-right-radius: 6px; }
  table.items th.r { text-align: right; }
  table.items th.c { text-align: center; }
  table.items td {
    padding: 9px 8px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    color: #333;
  }
  table.items td.r { text-align: right; }
  table.items td.c { text-align: center; }
  table.items tr:nth-child(even) td { background: #FAFBFC; }
  table.items tr:last-child td { border-bottom: 1px solid rgba(0,0,0,0.1); }

  /* ============ TOTALES ============ */
  .totals {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
  }
  .totals table { width: 300px; font-size: 12px; }
  .totals table td {
    padding: 6px 10px;
    color: #333;
  }
  .totals table td.r { text-align: right; font-weight: 500; }
  .totals .total-row td {
    font-size: 16px;
    font-weight: 800;
    color: var(--apple-text);
    border-top: 2px solid var(--apple-blue);
    padding-top: 10px;
    letter-spacing: -0.01em;
  }
  .totals .total-row td:first-child { color: var(--apple-blue); }

  /* ============ GARANTÍA ============ */
  .garantia {
    font-size: 10px;
    color: #555;
    margin-top: 28px;
    padding: 12px 14px;
    background: #F5F7FA;
    border-left: 3px solid var(--apple-blue);
    line-height: 1.6;
    border-radius: 0 6px 6px 0;
  }
  .garantia b { color: var(--apple-text); }

  /* ============ FIRMAS ============ */
  .firmas {
    margin-top: 64px;
    display: flex;
    justify-content: space-between;
    gap: 40px;
  }
  .firma { flex: 1; text-align: center; }
  .firma .linea {
    border-top: 1px solid #333;
    margin-bottom: 6px;
  }
  .firma .label {
    font-size: 10px;
    color: var(--apple-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .firma .nombre {
    font-size: 11px;
    font-weight: 600;
    color: var(--apple-text);
    margin-top: 3px;
  }

  /* ============ FOOTER DEL DOCUMENTO ============ */
  .footer {
    text-align: center;
    font-size: 10px;
    color: var(--apple-dim);
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }

  /* ============ TIRILLA POS (58mm) ============ */
  .tirilla-wrapper {
    display: flex;
    justify-content: center;
  }
 .tirilla {
  width: 48mm;
  background: white;
  padding: 3mm 2mm;
  font-family: 'Courier New', 'Courier', monospace;
  font-size: 10px;
  font-weight: 700;                /* ✅ TODO en negrita */
  line-height: 1.35;
  color: #000;
  -webkit-font-smoothing: none;    /* ✅ Sin suavizado: bordes duros */
  text-rendering: geometricPrecision;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
  border-radius: 4px;
}
  .tirilla.center { text-align: center; }
  .tirilla .bold { font-weight: bold; }
  .tirilla .linea { border-top: 1px dashed #000; margin: 5px 0; }
  .tirilla .doble-linea { border-top: 1px solid #000; margin: 5px 0; }
  .tirilla .fila {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    font-weight: 700;
  }
  .tirilla .fila span:first-child {
    flex: 1;
    font-weight: 700;
  }
  .tirilla .fila span:last-child {
    font-weight: 700;
    white-space: nowrap;
  }
  .tirilla .producto { margin: 5px 0; }
  .tirilla .producto .nombre { word-wrap: break-word; font-weight: bold; }
  .tirilla .producto .variant {
    font-size: 9px;
    font-weight: 700;               /* ✅ Negrita */
    color: #000;
    margin-top: 1px;
    letter-spacing: 0.1px;
  }
  .tirilla .producto .detalle {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    font-weight: 700;               /* ✅ Negrita */
    margin-top: 1px;
    letter-spacing: 0.2px;
  }
  .tirilla .total-final {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    margin: 8px 0;
    letter-spacing: 0.5px;
  }
  .tirilla .garantia-mini {
    font-size: 8px;
    font-weight: 700;
    margin-top: 8px;
    text-align: justify;
    line-height: 1.4;
  }
  .tirilla .gracias {
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    margin-top: 10px;
  }
  .tirilla .nota-final {
    text-align: center;
    font-size: 8px;
    font-weight: 700;
    margin-top: 4px;
    color: #000;
  }

  /* ============ IMPRESIÓN ============ */
  @media print {
    body { background: white; }
    .toolbar { display: none !important; }
    .doc-wrapper {
      padding: 0;
      background: white;
      min-height: auto;
    }
    .doc {
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      max-width: none;
    }
    .tirilla {
      box-shadow: none;
      border-radius: 0;
      width: 58mm;
      padding: 2mm 1mm;
    }
    @page { margin: 10mm; }
  }

  /* Tirilla: márgenes de impresión específicos */
  @media print and (max-width: 80mm) {
    @page { margin: 2mm; }
  }

  /* ============ RESPONSIVE (pantalla) ============ */
  @media (max-width: 768px) {
    .doc-wrapper { padding: 88px 12px 24px; }
    .doc { padding: 24px 18px; border-radius: 8px; }
    .doc-header { flex-direction: column; gap: 12px; }
    .doc-header .doc-type { text-align: left; }
    .toolbar { padding: 10px 12px; }
    .toolbar h1 { font-size: 12px; }
    .toolbar .format-switch button { padding: 5px 10px; font-size: 11px; }
    .toolbar .actions { gap: 6px; }
    .toolbar .btn-print, .toolbar .btn-close, .toolbar .btn-whatsapp { padding: 6px 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Toolbar (solo visible en pantalla) -->
<div class="toolbar">
  <h1 id="toolbar-title">Smartec · Previsualización</h1>

  <div class="format-switch">
    <button data-format="remision" class="active" onclick="switchFormat('remision')">📄 Remisión</button>
    <button data-format="tirilla" onclick="switchFormat('tirilla')">🧾 Tirilla</button>
    <button data-format="mediacarta" onclick="switchFormat('mediacarta')">📋 Media carta</button>
  </div>

  <div class="actions">
    <button class="btn-whatsapp" onclick="sendWhatsAppFromPreview()" title="Enviar comprobante por WhatsApp">
      📱 WhatsApp
    </button>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir / PDF</button>
    <button class="btn-close" onclick="window.close()">✕ Cerrar</button>
  </div>
</div>

<!-- Contenedor del documento -->
<div class="doc-wrapper">
  <div id="loading" class="text-center py-20 text-gray-500">
    Cargando documento...
  </div>
  <div id="doc-container" class="hidden"></div>
  <div id="error-container" class="hidden text-center py-20">
    <p class="text-red-500 font-bold mb-2">No se pudo cargar el documento</p>
    <p id="error-msg" class="text-sm text-gray-500"></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJ-bKabzQL5DIq2n1qlHKHadlEY17TT_I",
  authDomain: "smartec-8fc19.firebaseapp.com",
  projectId: "smartec-8fc19",
  storageBucket: "smartec-8fc19.firebasestorage.app",
  messagingSenderId: "879944967068",
  appId: "1:879944967068:web:287b3f2baf2c56f8b95e59",
  measurementId: "G-127MH9ZCN1"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const fmt = n => '$' + Math.round(Number(n||0)).toLocaleString('es-CO');
const fmtDate = ts => {
  if (!ts) return '-';
  const d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  return d.toLocaleString('es-CO', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
};
const fmtDateShort = ts => {
  if (!ts) return '-';
  const d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  return d.toLocaleDateString('es-CO', { year:'numeric', month:'2-digit', day:'2-digit' });
};
const fmtTime = ts => {
  if (!ts) return '-';
  const d = ts.seconds ? new Date(ts.seconds*1000) : new Date(ts);
  return d.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
};

const FORMAT_LABELS = {
  remision: 'Remisión',
  tirilla: 'Comprobante de venta',
  mediacarta: 'Documento comercial'
};

/* ============ INIT ============ */
async function init() {
  const params = new URLSearchParams(window.location.search);
  const saleId = params.get('id');
  const format = params.get('format') || 'remision';

  if (!saleId) {
    return showError('Falta el ID de la venta en la URL');
  }

  document.title = `Imprimir | Smartec`;

  try {
    // Importar helpers que podríamos necesitar
    const { collection, query, where, getDocs } = await import(
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js"
    );

    let sale = null;

    // ============================================================
    // 1. Intentar por ID del documento (getDoc directo, rápido)
    // ============================================================
    try {
      const saleSnap = await getDoc(doc(db, 'sales', saleId));
      if (saleSnap.exists()) {
        sale = { id: saleSnap.id, ...saleSnap.data() };
        console.log('📄 Venta cargada por ID:', saleId);
      }
    } catch (e) {
      console.warn('getDoc por ID falló (probablemente no es un ID real):', e.message);
    }

    // ============================================================
    // 2. Si no se encontró, buscar por documentNumber
    //    → OBLIGATORIO filtrar por storeId (por las rules de seguridad)
    // ============================================================
    if (!sale) {
      // Necesitamos saber de qué tienda es la venta
      // Primero leemos el perfil del usuario autenticado
      const authUser = auth.currentUser;
      if (!authUser) {
        return showError('No hay sesión activa. Inicia sesión de nuevo.');
      }

      // Leemos el perfil del usuario actual
      const userSnap = await getDoc(doc(db, 'users', authUser.uid));
      if (!userSnap.exists()) {
        return showError('No se encontró el perfil del usuario.');
      }
      const userData = userSnap.data();
      const isSuper = userData.role === 'superadmin';
      const myStoreId = userData.storeId;

      let results;

      if (isSuper) {
        // Superadmin: query sin filtro de tienda (rules lo permiten)
        const q = query(
          collection(db, 'sales'),
          where('documentNumber', '==', saleId)
        );
        results = await getDocs(q);
      } else {
        // Admin/Vendedor: query CON filtro de tienda (rules lo exigen)
        if (!myStoreId) {
          return showError('No tienes una tienda asignada.');
        }
        const q = query(
          collection(db, 'sales'),
          where('documentNumber', '==', saleId),
          where('storeId', '==', myStoreId)
        );
        results = await getDocs(q);
      }

      if (results.empty) {
        return showError('La venta no existe o no pertenece a tu tienda.');
      }

      const first = results.docs[0];
      sale = { id: first.id, ...first.data() };
      console.log('📄 Venta cargada por documentNumber:', saleId, '· store:', sale.storeId);
    }

    // ============================================================
    // 3. Cargar settings (para datos de empresa + logos)
    // ============================================================
    const setSnap = await getDoc(doc(db, 'settings', 'general'));
    const settings = setSnap.exists() ? setSnap.data() : {};

    // Guardar en window para acceso global (render functions + switch)
    window.__sale = sale;
    window.__settings = settings;
    window.__currentFormat = format;

    // ============================================================
    // 4. Renderizar el documento con el formato inicial
    // ============================================================
    renderCurrentFormat();

    $('doc-container').classList.remove('hidden');
    $('loading').classList.add('hidden');
  } catch(e) {
    console.error(e);
    showError(e.message);
  }
}

/* ============================================================
   🆕 RENDERIZAR EL FORMATO ACTUAL
   Usa window.__sale, window.__settings, window.__currentFormat
============================================================ */
function renderCurrentFormat() {
  const sale = window.__sale;
  const settings = window.__settings;
  const format = window.__currentFormat || 'remision';

  // Actualizar título
  $('toolbar-title').innerHTML = `Smartec · ${FORMAT_LABELS[format] || 'Documento'}`;

  // Actualizar botones del switch
  document.querySelectorAll('.format-switch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.format === format);
  });

  // Render según formato
  let html = '';
  if (format === 'tirilla') {
    html = renderTirilla(sale, settings);
  } else if (format === 'mediacarta') {
    html = renderMediaCarta(sale, settings);
  } else {
    html = renderRemision(sale, settings);
  }

  $('doc-container').innerHTML = html;
}

/* ============================================================
   🆕 CAMBIAR DE FORMATO SIN RECARGAR
============================================================ */
window.switchFormat = (newFormat) => {
  if (!['remision', 'tirilla', 'mediacarta'].includes(newFormat)) return;
  if (newFormat === window.__currentFormat) return;
  window.__currentFormat = newFormat;
  renderCurrentFormat();
};
/* ============================================================
   🆕 ENVIAR COMPROBANTE POR WHATSAPP
   Usa window.__sale y window.__currentFormat (ya cargados en init).
============================================================ */
window.sendWhatsAppFromPreview = () => {
  const s = window.__sale;
  if (!s) {
    alert('No hay una venta cargada para enviar.');
    return;
  }

  const formatLabel = FORMAT_LABELS[window.__currentFormat] || 'Comprobante';

  // Construir mensaje (mismo contenido que antes en venta.html)
  let msg = `*${s.storeName ? s.storeName.toUpperCase() : 'SMARTEC'}*\n`;
  msg += `Vendedor: ${s.sellerName || s.sellerEmail || ''}\n`;
  msg += `${formatLabel} #${s.documentNumber || s.id.slice(-6).toUpperCase()}\n`;

  const rawDate = s.createdAt?.seconds
    ? new Date(s.createdAt.seconds * 1000)
    : (s.createdAt ? new Date(s.createdAt) : new Date());
  msg += `Fecha: ${rawDate.toLocaleString('es-CO')}\n\n`;

  msg += `*Cliente:* ${s.customer?.name || ''}\n`;
  if (s.customer?.phone) msg += `Tel: ${s.customer.phone}\n`;
  if (s.customer?.address) {
    msg += `Dir: ${s.customer.address}${s.customer.city ? ', ' + s.customer.city : ''}\n`;
  }

  msg += `\n*Productos:*\n`;
  (s.items || []).forEach(it => {
    msg += `• ${it.qty}× ${it.name}`;
    if (it.colorName) msg += ` (${it.colorName})`;
    if (it.size) msg += ` [${it.size}]`;
    msg += ` - ${fmt(it.qty * it.unitPrice)}\n`;
  });

  msg += `\nSubtotal: ${fmt(s.subtotal)}`;
  if (s.discount > 0) msg += `\nDescuento: -${fmt(s.discount)}`;
  if (s.shipping > 0) msg += `\nEnvío: ${fmt(s.shipping)}`;
  if (s.surchargeAmount > 0) msg += `\nRecargo tarjeta: ${fmt(s.surchargeAmount)}`;
  msg += `\n*TOTAL: ${fmt(s.total)}*\n`;
  msg += `Método de pago: ${s.paymentMethod || '-'}\n\n`;
  msg += `*GARANTÍA:* Todos los productos cuentan con garantía mínima de 12 meses o la superior que otorgue la marca. Nuestro equipo te acompañará en cualquier solicitud de garantía.\n\n`;
  msg += `¡Gracias por tu compra! 🛒`;

  // Detectar número del cliente
  const rawPhone = (s.customer?.phone || '').replace(/\D/g, '');
  let waNum = rawPhone;
  if (rawPhone.length === 10) waNum = '57' + rawPhone; // Colombia por defecto

  const url = waNum
    ? `https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`
    : `https://wa.me/?text=${encodeURIComponent(msg)}`;

  window.open(url, '_blank');
};
function showError(msg) {
  $('loading').classList.add('hidden');
  $('error-container').classList.remove('hidden');
  $('error-msg').innerText = msg;
}

/* ============ RENDER TIRILLA POS (48mm) ============ */
function renderTirilla(sale, settings) {
  const c = getCompanyInfo(sale, settings);
  const docNumber = sale.documentNumber || 'SIN-NÚMERO';
  const date = sale.createdAt?.seconds
    ? new Date(sale.createdAt.seconds * 1000)
    : new Date();

  const dateStr = date.toLocaleDateString('es-CO');
  const timeStr = date.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });

  const logoUrl = settings.logoUrl || null;

  // ============ GARANTÍA DINÁMICA ============
  // Si TODOS los items tienen el mismo warrantyMonths, mostramos ese.
  // Si son distintos, mostramos "según el producto".
  const warranties = (sale.items || [])
    .map(it => Number(it.warrantyMonths ?? 0))
    .filter(n => !isNaN(n));

  let garantiaTexto = '';

  if (!warranties.length) {
    // Ningún producto tiene garantía definida → mensaje genérico
    garantiaTexto = 'Garantía mínima de 12 meses o la superior otorgada por el fabricante.';
  } else {
    const unique = [...new Set(warranties)];
    if (unique.length === 1 && unique[0] > 0) {
      const meses = unique[0];
      if (meses === 1) {
        garantiaTexto = 'Garantía de 1 mes por defectos de fábrica.';
      } else if (meses < 12) {
        garantiaTexto = `Garantía de ${meses} meses por defectos de fábrica.`;
      } else if (meses === 12) {
        garantiaTexto = 'Garantía de 12 meses o la superior del fabricante.';
      } else {
        garantiaTexto = `Garantía de ${meses} meses o la superior del fabricante.`;
      }
    } else {
      garantiaTexto = 'Garantía según el producto. Ver detalle en cada ítem.';
    }
  }

  garantiaTexto += ' No cubre daños por mal uso, golpes, líquidos o manipulación indebida. Presente este recibo para hacerla efectiva.';

  // ============ HELPER PARA GARANTÍA POR ITEM ============
  const formatWarranty = (months) => {
    const n = Number(months ?? 0);
    if (!n || n <= 0) return '';
    if (n === 1) return 'Garantía: 1 mes';
    if (n < 12) return `Garantía: ${n} meses`;
    if (n === 12) return 'Garantía: 12 meses';
    return `Garantía: ${n} meses`;
  };

  return `
    <div class="tirilla-wrapper">
      <div class="tirilla">

        <!-- ═══════════ CABECERA ═══════════ -->
        ${logoUrl ? `
          <div class="center" style="margin-bottom:6px;">
            <img src="${logoUrl}" alt="Logo" style="max-height:38px; max-width:44mm; object-fit:contain; filter: grayscale(100%) contrast(1.2);">
          </div>
        ` : `
          <div class="center bold" style="font-size:15px; letter-spacing:1.5px;">SMARTEC</div>
        `}

        <div class="center bold" style="font-size:10px; margin-top:3px;">
          ${escapeHtmlTirilla(c.razonSocial || '')}
        </div>
        <div class="center" style="font-size:9px;">
          NIT: ${escapeHtmlTirilla(c.nit || '—')}
        </div>
        ${c.phone ? `<div class="center" style="font-size:9px;">Tel: ${escapeHtmlTirilla(c.phone)}</div>` : ''}

        <div class="doble-linea"></div>

        <!-- ═══════════ TIPO DE DOCUMENTO ═══════════ -->
        <div class="center bold" style="font-size:11px; letter-spacing:0.5px; margin-top:2px;">
          COMPROBANTE DE VENTA
        </div>
        <div class="center bold" style="font-size:10px; margin-top:2px;">
          No. ${escapeHtmlTirilla(docNumber)}
        </div>
        <div class="center" style="font-size:9px; margin-top:1px;">
          ${dateStr} · ${timeStr}
        </div>
        ${c.storeName ? `<div class="center" style="font-size:9px; margin-top:1px;">Sede: ${escapeHtmlTirilla(c.storeName)}</div>` : ''}

        <div class="doble-linea"></div>

        <!-- ═══════════ CLIENTE ═══════════ -->
        <div class="bold" style="font-size:9px; margin-bottom:2px;">CLIENTE</div>
        <div style="font-size:10px; line-height:1.4;">
          ${escapeHtmlTirilla(sale.customer?.name || '-')}
        </div>
        ${sale.customer?.phone ? `<div style="font-size:9px;">Tel: ${escapeHtmlTirilla(sale.customer.phone)}</div>` : ''}
        ${sale.customer?.address ? `<div style="font-size:9px; line-height:1.3;">${escapeHtmlTirilla(sale.customer.address)}${sale.customer.city ? ', ' + escapeHtmlTirilla(sale.customer.city) : ''}</div>` : ''}

        <div class="linea"></div>

        <!-- ═══════════ PRODUCTOS ═══════════ -->
        <div class="bold" style="font-size:9px; margin-bottom:3px;">PRODUCTOS</div>
        ${(sale.items || []).map(it => {
          const variantParts = [];
          if (it.colorName) variantParts.push(it.colorName);
          if (it.size) variantParts.push(it.size);
          const variant = variantParts.join(' · ');
          const warrantyLine = formatWarranty(it.warrantyMonths);

          return `
            <div class="producto">
              <div class="nombre">${escapeHtmlTirilla(it.name || '-')}</div>
              ${variant ? `<div class="variant">${escapeHtmlTirilla(variant)}</div>` : ''}
              ${warrantyLine ? `<div class="variant" style="color:#000;">${warrantyLine}</div>` : ''}
              <div class="detalle">
                <span>${it.qty} × ${fmt(it.unitPrice)}</span>
                <span class="bold">${fmt((it.qty||0) * (it.unitPrice||0))}</span>
              </div>
            </div>
          `;
        }).join('')}

        <div class="linea"></div>

        <!-- ═══════════ TOTALES ═══════════ -->
        <div class="fila"><span>Subtotal</span><span>${fmt(sale.subtotal)}</span></div>
        ${sale.discount ? `<div class="fila"><span>Descuento</span><span>-${fmt(sale.discount)}</span></div>` : ''}
        ${sale.shipping ? `<div class="fila"><span>Envío</span><span>${fmt(sale.shipping)}</span></div>` : ''}
        ${sale.surchargeAmount ? `<div class="fila"><span>Rec. tarjeta</span><span>${fmt(sale.surchargeAmount)}</span></div>` : ''}

        <div class="doble-linea"></div>

        <div class="total-final">TOTAL ${fmt(sale.total)}</div>

        <div class="doble-linea"></div>

        <!-- ═══════════ PAGO ═══════════ -->
        <div class="fila"><span>Pago:</span><span>${escapeHtmlTirilla(capitalizeFirst(sale.paymentMethod) || '-')}</span></div>
        ${sale.paymentChannelBank ? `<div class="fila" style="font-size:9px;"><span>  ${escapeHtmlTirilla(sale.paymentChannelBank)}${sale.paymentChannelName ? ' — ' + escapeHtmlTirilla(sale.paymentChannelName) : ''}</span><span></span></div>` : ''}
        <div class="fila"><span>Vendedor:</span><span>${escapeHtmlTirilla(truncate((sale.sellerName || sale.sellerEmail || '-'), 18))}</span></div>

        ${sale.customer?.notes ? `
          <div class="linea"></div>
          <div style="font-size:9px; line-height:1.3;">
            <b>Nota:</b> ${escapeHtmlTirilla(sale.customer.notes)}

        <!-- ═══════════ GARANTÍA ═══════════ -->
        <div class="linea"></div>
        <div class="garantia-mini">
          <b>GARANTÍA:</b> ${escapeHtmlTirilla(garantiaTexto)}
        </div>

        <!-- ═══════════ PIE ═══════════ -->
        <div class="doble-linea"></div>

        <div class="gracias">¡GRACIAS POR SU COMPRA!</div>
        <div class="nota-final">Este documento no es factura electrónica de venta.</div>

      </div>
    </div>
  `;
}

/* ============ HELPERS TIRILLA ============ */
function escapeHtmlTirilla(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function capitalizeFirst(str) {
  if (!str) return '';
  const s = String(str);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function truncate(str, max) {
  if (!str) return '';
  const s = String(str);
  if (s.length <= max) return s;
  return s.slice(0, max - 1) + '…';
}

/* ============ RENDER TOTALES ============ */
function renderTotals(sale, compact = false) {
  const fontSize = compact ? '11px' : '12px';
  const totalFont = compact ? '14px' : '16px';

        ${sale.discount ? `
        <tr>
          <td>Descuento</td>

        </tr>` : ''}
        ${sale.shipping ? `
        <tr>
          <td>Envío</td>
          <td class="r">${fmt(sale.shipping)}</td>
        </tr>` : ''}
        ${sale.surchargeAmount ? `
        <tr>
          <td>Recargo tarjeta</td>
          <td class="r">${fmt(sale.surchargeAmount)}</td>
        </tr>` : ''}
        <tr class="total-row" style="font-size:${totalFont};">
          <td>TOTAL</td>
          <td class="r">${fmt(sale.total)}</td>
        </tr>
      </table>
    </div>
  `;
}
